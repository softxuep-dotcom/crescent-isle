<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="月湾岛：沿着木码头、海岸与林间小径慢慢探索。基于 Tidewater 的 WebGPU 海岛场景。" />
  <title>月湾岛 · Crescent Isle</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="/src/ui/ui.css" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #142e36; }
    #app, #app canvas { display: block; }
    #loader { background: radial-gradient(ellipse at 70% 25%, #426f74, #142e36 75%); }
    .loader-title { font-family: "Microsoft YaHei", sans-serif; letter-spacing: .25em; }
    #fps { position: fixed; top: 10px; left: 12px; z-index: 50; font: 12px/1.2 ui-monospace, monospace; color: #e8f6ff; background: #08162088; padding: 5px 9px; border-radius: 6px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="fps">-- fps</div>
  <div id="loader" role="status" aria-live="polite" aria-label="正在准备月湾岛">
    <div class="loader-scrim"></div>
    <div class="loader-inner">
      <div class="loader-brand">
        <p class="loader-kicker">CRESCENT ISLE · 海岛漫游</p>
        <h1 class="loader-title">月湾岛</h1>
        <p class="loader-tagline">走过木码头，听海浪，沿着小屋旁的步道走进树林。</p>
      </div>
      <div class="loader-panel">
        <div class="loader-row">
          <span class="loader-status">正在准备…</span>
          <span class="loader-meta"><span class="loader-pct">0%</span><span class="loader-time">0:00</span></span>
        </div>
        <div class="loader-bar"><div class="loader-fill"></div><div class="loader-glint"></div></div>
        <div class="loader-note">首次进入会生成地形并编译着色器，请等待准备完成。推荐使用支持 WebGPU 的桌面浏览器。</div>
        <div class="loader-tips">
          <span class="loader-tip-label">漫游提示</span>
          <div class="loader-tip-list">
            <p class="loader-tip"><kbd>W A S D</kbd> 行走，鼠标环顾，<kbd>Shift</kbd> 快走。</p>
            <p class="loader-tip">沿木步道经过三间小屋，再从沙滩回到码头。</p>
            <p class="loader-tip"><kbd>Home</kbd> 随时回到入口；<kbd>Esc</kbd> 释放鼠标。</p>
            <p class="loader-tip"><kbd>H</kbd> 调节海况与光照，<kbd>F1</kbd> 查看完整操作说明。</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
